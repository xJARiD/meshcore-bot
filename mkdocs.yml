site_name: MeshCore Bot Docs
site_url: https://xjarid.github.io/meshcore-bot/
site_description: Documentation for the EastMesh MeshCore bot

repo_name: xJARiD/meshcore-bot
repo_url: https://github.com/xJARiD/meshcore-bot
edit_uri: edit/develop/eastmesh-docs/
docs_dir: eastmesh-docs

theme:
  name: material
  logo: _assets/xjarid.svg
  favicon: _assets/xjarid.svg
  features:
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - _stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
