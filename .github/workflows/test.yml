name: Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - eastmesh
      - develop
  workflow_dispatch:

jobs:
  lint-frontend:
    name: Lint Frontend (HTMLHint + ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend lint tools
        run: npm ci

      - name: HTMLHint — lint HTML templates
        run: npm run lint:html

      - name: ESLint — lint inline JavaScript
        run: npm run lint:js

  lint-shell:
    name: Lint Shell Scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: ShellCheck — lint all .sh files
        run: |
          find . -name "*.sh" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            -print0 | xargs -0 shellcheck --severity=warning

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --locked --group lint

      - name: ruff check — fail on any lint error
        run: uv run ruff check modules/ tests/

      - name: Log injection check — fail on new unsanitized logger calls
        run: uv run python scripts/check_log_injection.py

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --locked --extra test --group lint

      - name: mypy — strict overrides on typed modules
        run: uv run mypy modules/ --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short
